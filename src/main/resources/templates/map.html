<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.css" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/mapStyle.css}">
</head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>

    <div id="filterForm">
    <h4>Filter Map:</h4>
    <!-- Cafe toggle (applies to vancouver-cafes.geojson) -->
    <label><input type="checkbox" id="cafeToggle" value = "Cafes" checked>Cafes</label><br>
    <label><input type="checkbox" id = "SFUToggle" value = "Study Spaces at SFU" checked>SFU</label><br>
    <label><input type="checkbox" id="contributorToggle" value="Contributor spots" checked><span style="color:#2e7d32">●</span> Contributor spots</label>
    <hr>
    <h4>SFU Study Spaces</h4>
    <h4>SFU Study Spaces</h4>
    <label>
        <input type="checkbox" name="category" value="Library" checked> Libraries
    </label><br>
    <label>
        <input type="checkbox" name="category" value="Academic & Study Space" checked> Academic Spaces
    </label><br>
    <label>
        <input type="checkbox" name="category" value="Indoor Seating" checked> Indoor Seating
    </label><br>
    <label>
        <input type="checkbox" name="category" value="Technical Seating" checked> Technical Seating
    </label><br>
    <label>
        <input type="checkbox" name="category" value="Social Lounge" checked> Social Lounges
    </label>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>
    <script src="map.js"></script>
</body>

</html>
