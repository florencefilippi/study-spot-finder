<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My Study Spots')}"></head>
<body>
  <div th:replace="~{fragments :: navbar}"></div>

  <main>
    <div class="card">
      <h1>My study spots</h1>
      <a class="btn" th:href="@{/contributor/spots/new}">Add a study spot</a>

      <p th:if="${#lists.isEmpty(spots)}">You have not added any study spots yet.</p>

      <table class="data" th:unless="${#lists.isEmpty(spots)}">
        <thead>
          <tr><th>Name</th><th>Type</th><th>Hours</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="spot : ${spots}">
            <td th:text="${spot.name}">Name</td>
            <td th:text="${spot.type}">Type</td>
            <td th:text="${spot.openingHours}">Hours</td>
            <td><a th:href="@{/contributor/spots/{id}/edit(id=${spot.id})}">Edit</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <div th:replace="~{fragments :: footer}"></div>
</body>
</html>
