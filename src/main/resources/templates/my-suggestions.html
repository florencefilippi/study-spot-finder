<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My Suggestions')}"></head>
<body>
  <div th:replace="~{fragments :: navbar}"></div>

  <main>
    <div class="card">
      <h1>My Suggestions</h1>

      <p class="success" th:if="${success}" th:text="${success}"></p>
      <p class="hint" th:text="|You have ${pendingCount} of ${maxPending} suggestions waiting for review.|"></p>

      <a class="btn" th:href="@{/suggestions/new}">Suggest a study spot</a>

      <p th:if="${#lists.isEmpty(suggestions)}">You haven't suggested any spots yet.</p>

      <table th:unless="${#lists.isEmpty(suggestions)}">
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Submitted</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="s : ${suggestions}">
            <td>
              <strong th:text="${s.name}">Name</strong><br>
              <span class="hint" th:text="${s.address}">Address</span>
            </td>
            <td th:text="${s.type}">Type</td>
            <td th:text="${dateFormat.format(s.createdAt)}">Date</td>
            <td>
              <span class="status"
                    th:classappend="|status-${#strings.toLowerCase(s.status)}|"
                    th:text="${#strings.capitalize(#strings.toLowerCase(s.status))}">Pending</span>
              <p class="reason"
                 th:if="${s.rejectionReason != null}"
                 th:text="|Reason: ${s.rejectionReason}|"></p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <div th:replace="~{fragments :: footer}"></div>
</body>
</html>
