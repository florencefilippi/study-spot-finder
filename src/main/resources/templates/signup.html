<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign Up')}"></head>
<body>
  <main class="narrow">
    <div class="card">
      <h1>Create an Account</h1>

      <p class="error" th:if="${error}" th:text="${error}"></p>

      <form class="stack" th:action="@{/signup}" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" th:value="${username}" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" minlength="8" required>

        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>

        <button class="btn" type="submit">Sign Up</button>
      </form>

      <p>Already have an account? <a th:href="@{/login}">Log in</a></p>
    </div>
  </main>
</body>
</html>
