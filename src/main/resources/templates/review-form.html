<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Edit Review')}"></head>
<body>
    <!--Nav bar-->
    <div th:replace="~{fragments :: navbar}"></div>

    <main class="narrow">
        <div class="card">
            <h1>Edit your review</h1>

            <form class="stack" th:action="@{/locations/reviews/{id}/edit(id=${reviewId})}" method="post">
                <label for="text">Your review</label>
                <textarea id="text" name="text" rows="5" required
                    th:maxlength="${maxLength}" th:text="${text}">
                </textarea>
                <p class="error" th:if="${error}" th:text="${error}"></p>

                <button class="btn" type="submit">Save</button>
                <a th:href="@{/locations/details(id=${locationId})}">Cancel</a>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments :: footer}"></div>
</body>
</html>
