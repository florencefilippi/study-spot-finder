<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Home')}"></head>
<body>
  <div th:replace="~{fragments :: navbar}"></div>

  <main>
    <div class="card">
      <h1>Home</h1>
      <p>Welcome, <span sec:authentication="name"></span>!</p>
      <h2>Find your next study spot</h2>
      <p>Browse cafes and study spaces around SFU and Vancouver.</p>
      <a class="btn" th:href="@{/map}">Open the map</a>
      <a class="btn" th:href="@{/suggestions/new}">Suggest a study spot</a>
      <a class="btn" th:href="@{/suggestions/mine}">My suggestions</a>
    </div>
  </main>

  <div th:replace="~{fragments :: footer}"></div>
</body>
</html>
