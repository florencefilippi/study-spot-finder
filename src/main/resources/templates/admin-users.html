<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage Users')}"></head>
<body>
  <div th:replace="~{fragments :: navbar}"></div>

  <main>
    <div class="card">
      <h1>Manage Users</h1>

      <p class="success" th:if="${success}" th:text="${success}"></p>
      <p class="error" th:if="${error}" th:text="${error}"></p>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Change Role</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.role}"></td>
            <td>
              <span th:if="${user.username == currentUsername}">(you)</span>

              <form th:unless="${user.username == currentUsername}"
                    th:action="@{/admin/users/{id}/role(id=${user.id})}"
                    method="post" class="inline-form">
                  <select name="role">
                    <option th:each="r : ${roles}"
                            th:value="${r}"
                            th:text="${r}"
                            th:selected="${r == user.role}"></option>
                  </select>
                  <button type="submit" class="btn btn-small">Update</button>
                </form>
            </td>
            <td>
              <form th:unless="${user.username == currentUsername}"
                    th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                    th:data-username="${user.username}"
                    method="post" class="inline-form"
                    onsubmit="return confirm('Delete ' + this.dataset.username + '? This cannot be undone.');">
                <button type="submit" class="btn btn-small btn-danger">Delete</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>

      <p><a th:href="@{/admin}">Back to admin dashboard</a></p>
    </div>
  </main>

  <div th:replace="~{fragments :: footer}"></div>
</body>
</html>
