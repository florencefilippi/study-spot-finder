<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
>
  <head th:replace="~{fragments :: head('Saved')}"></head>
  <body>
    <div th:replace="~{fragments :: navbar}"></div>

    <main>
      <div class="card">
        <h1>Saved Study Spots</h1>

        <p class="success" th:if="${param.removed}">Spot removed from your Saved List.</p>

        <p th:if="${savedSpots.isEmpty()}">No spots saved yet.</p>

        <div th:unless="${savedSpots.isEmpty()}">
            <div class="saved-item" th:each="spot : ${savedSpots}">
                <h3 th:text="${spot.spotName}">Spot name</h3>

                <form th:action="@{/saved/remove}" method="post">
                    <input type="hidden" name="id" th:value="${spot.id}">
                    <button type="submit" class="btn">Remove</button>
                </form>
            </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments :: footer}"></div>
  </body>
</html>
